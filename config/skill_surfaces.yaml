# Skill-surface registry — one entry per `skill_surfaces:` value referenced
# in config/agents.yaml. Surfaces are domain-level capability labels that
# map a persona to concrete skill modules or slash commands.
#
# Schema per entry:
#   description: one-line purpose (required)
#   category: one of {content, social, video, research, ecommerce,
#             security, compliance, dev, ops}
#   module: optional dotted path to a skill module (if known today)
#   command: optional slash command that exposes this surface
#   hidden: false by default — true means excluded from user-facing catalogs
#
# Validator warns on: missing description, unknown category, and surfaces
# referenced from agents.yaml but not defined here.

