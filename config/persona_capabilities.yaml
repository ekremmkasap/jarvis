##############################################################
# Persona Capability Matrix
# Policy gate uzerine ek kisitlayici katman.
# Matrix SADECE baseline policy'i daha kisitlayici yapar,
# hicbir zaman gevsetmez.
#
# Karar sozlesmesi:
#   allow             -> baseline karari aynen gecerli
#   require_approval  -> baseline allow ise approval'a yukselt
#   deny              -> baseline ne olursa olsun denied
#
# Action class'lari:
#   shell.safe, shell.full
#   pc.low_risk, pc.medium_risk, pc.high_risk
#   openclaw.helper, openclaw.deliver
#   operator.high_risk
#   dreams.snapshot, dreams.report
##############################################################

persona_capabilities:
  default:
    shell.safe: allow
    shell.full: require_approval
    pc.low_risk: allow
    pc.medium_risk: require_approval
    pc.high_risk: require_approval
    openclaw.helper: require_approval
    openclaw.deliver: require_approval
    operator.high_risk: require_approval
    dreams.snapshot: require_approval
    dreams.report: require_approval

  # ----- Musteri-facing personalar: ops yetkisi YOK -----
